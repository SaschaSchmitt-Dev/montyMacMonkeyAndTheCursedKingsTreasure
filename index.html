<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monty MacMonkey and the Cursed King’s Treasure</title>

    <link rel="stylesheet" href="style.css">

    <script src="./scripts/classes/drawable-object.class.js" defer></script>
    <script src="./scripts/classes/movable-object.class.js" defer></script>
    <script src="./scripts/classes/background.class.js" defer></script>
    <script src="./scripts/classes/ground.class.js" defer></script>
    <script src="./scripts/classes/character.class.js" defer></script>
    <script src="./scripts/classes/enemy.class.js" defer></script>
    <script src="./scripts/classes/enemy-collisions.class.js" defer></script>
    <script src="./scripts/classes/platform.class.js" defer></script>
    <script src="./scripts/classes/banana-ammo.class.js" defer></script>
    <script src="./scripts/classes/score-item.class.js" defer></script>
    <script src="./scripts/classes/level.class.js" defer></script>
    <script src="./scripts/levels/level-1.js" defer></script>
    <script src="./scripts/classes/banana-projectile.class.js" defer></script>
    <script src="./scripts/classes/projectile-collisions.class.js" defer></script>
    <script src="./scripts/classes/throw-controller.class.js" defer></script>
    <script src="./scripts/classes/boss-projectile.class.js" defer></script>
    <script src="./scripts/classes/boss.class.js" defer></script>
    <script src="./scripts/classes/boss-chamber.class.js" defer></script>
    <script src="./scripts/classes/health-bar.class.js" defer></script>
    <script src="./scripts/classes/ammo-bar.class.js" defer></script>
    <script src="./scripts/classes/score-bar.class.js" defer></script>
    <script src="./scripts/classes/boss-health-bar.class.js" defer></script>
    <script src="./scripts/classes/world.class.js" defer></script>
    <script src="./scripts/classes/keyboard.class.js" defer></script>
    <script src="./scripts/game.js" defer></script>

</head>

<body>

    <h1>Monty MacMonkey and the Cursed King’s Treasure</h1>

    <div class="game-frame">
    <canvas id="canvas" width="960" height="540" tabindex="0" aria-label="Spielfeld von Monty MacMonkey">
        Dein Browser unterstützt das Canvas-Spielfeld nicht.
    </canvas>
        <section id="end-screen" class="end-screen" aria-labelledby="end-title" hidden>
            <div id="end-panel" class="end-panel">
                <h2 id="end-title">Game Over</h2>
                <p id="end-message" role="status"></p>
                <dl id="victory-score" class="victory-score" aria-label="Punkteaufstellung" hidden>
                    <dt>Sammelpunkte</dt><dd id="collected-score">0</dd>
                    <dt id="life-bonus-label">Leben</dt><dd id="life-bonus">0</dd>
                    <dt id="ammo-bonus-label">Munition</dt><dd id="ammo-bonus">0</dd>
                    <dt class="score-total">Gesamtpunkte</dt><dd id="total-score" class="score-total">0</dd>
                </dl>
            </div>
            <button id="restart-button" class="retry-button" type="button">Noch einmal spielen</button>
        </section>
    </div>

</body>

</html>
